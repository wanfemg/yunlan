name: Build yunlan images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yunlan-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-check:
    name: Check install and service syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell entry points
        run: bash -n install.sh deploy.sh scripts/manage-install.sh
      - name: Check finance JavaScript
        run: node --check finance/web/app.js
      - name: Check finance Python syntax
        run: python3 -m compileall -q finance
      - name: Check installer Python syntax
        run: python3 -m compileall -q scripts
      - name: Check deployment failure and readiness paths
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate complete Compose schema
        env:
          APP_MODE: demo
          ADMIN_TOKEN: yunlan-ci-admin-placeholder-not-production
          FINANCE_PROXY_SECRET: yunlan-ci-finance-placeholder-not-production
          PROBE_SHARED_SECRET: yunlan-ci-probe-placeholder-not-production
        run: docker compose --profile probe config --quiet

  deployment-smoke:
    name: Run deployed containers and owner workflow
    needs: source-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BIND_ADDRESS: "127.0.0.1"
      NEWAPI_UPSTREAM: http://127.0.0.1:18080
      LOGIN_PROBE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Build and deploy all services
        run: bash deploy.sh --demo --build --non-interactive
      - name: Verify published ports and owner workflow
        run: |
          python3 scripts/smoke-deployment.py --probe-url http://127.0.0.1:18081
          python3 scripts/check-panel-compose.py --root "$PWD"
      - name: Reproduce and migrate legacy multi-file labels
        run: |
          docker network create yunlan-ci-upstream
          printf '%s\n' '{"services":{"site-admin":{"networks":["default","ci_upstream"]}},"networks":{"ci_upstream":{"external":true,"name":"yunlan-ci-upstream"}}}' > .yunlan.compose.yaml
          docker compose --env-file .env -f compose.yaml -f .yunlan.compose.yaml --profile probe up -d --no-build --force-recreate
          python3 scripts/verify-deployment.py --mode demo --probe
          python3 -c 'import json,subprocess; p=next(p for p in json.loads(subprocess.check_output(["docker","compose","ls","--all","--format","json"])) if p["Name"]=="yunlan"); assert "," in p["ConfigFiles"], "legacy multi-file labels not reproduced"'
          bash deploy.sh --demo --non-interactive
          python3 scripts/check-panel-compose.py --root "$PWD"
          python3 scripts/smoke-deployment.py --probe-url http://127.0.0.1:18081
      - name: Disable a legacy probe without leaving stale file labels
        env:
          LOGIN_PROBE_ENABLED: "false"
        run: |
          docker compose --env-file .env -f compose.yaml -f .yunlan.compose.yaml --profile probe up -d --no-build --force-recreate
          bash deploy.sh --demo --non-interactive
          test -z "$(docker ps -a --filter label=com.docker.compose.project=yunlan --filter label=com.docker.compose.service=login-probe --format '{{.ID}}')"
          python3 scripts/check-panel-compose.py --root "$PWD"
          python3 scripts/smoke-deployment.py
      - name: Install older Compose without wait-timeout
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fL --retry 2 https://github.com/docker/compose/releases/download/v2.16.0/docker-compose-linux-x86_64 -o "$HOME/.docker/cli-plugins/docker-compose"
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - name: Recreate services with older Compose
        run: |
          docker compose -f .yunlan.runtime.yaml config --quiet
          bash deploy.sh --demo --non-interactive
          docker compose -f .yunlan.runtime.yaml up -d --no-build --force-recreate
          python3 scripts/verify-deployment.py --mode demo --probe --compose-file "$PWD/.yunlan.runtime.yaml"
          python3 scripts/check-panel-compose.py --root "$PWD"
          python3 scripts/smoke-deployment.py --probe-url http://127.0.0.1:18081
      - name: Show deployment diagnostics on failure
        if: failure()
        run: python3 scripts/deploy-diagnostics.py --root "$PWD" --stage CI --exit-code 1 -- --project-name yunlan -f "$PWD/.yunlan.runtime.yaml"
      - name: Stop test services
        if: always()
        run: |
          if [[ -f .yunlan.runtime.yaml ]]; then
            docker compose -f .yunlan.runtime.yaml down --remove-orphans
          fi

  images:
    name: Build ${{ matrix.component }}
    needs: [source-check, deployment-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: yunlan
            dockerfile: Dockerfile
            suffix: ""
          - component: yunlan-finance
            dockerfile: finance/Dockerfile
            suffix: "-finance"
          - component: yunlan-probe
            dockerfile: login-probe/Dockerfile
            suffix: "-probe"
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: printf 'name=ghcr.io/%s%s\n' "${REPOSITORY,,}" '${{ matrix.suffix }}' >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  published-install:
    name: Install published images from an empty directory
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEWAPI_UPSTREAM: http://127.0.0.1:18080
      LOGIN_PROBE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Select an empty installation directory
        run: printf 'YUNLAN_INSTALL_DIR=%s/yunlan\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run the remote one-line installer
        run: bash <(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh") --demo
      - name: Verify installed revision and published images
        run: |
          test "$(git -C "$YUNLAN_INSTALL_DIR" rev-parse HEAD)" = "$GITHUB_SHA"
          for service in site-admin finance login-probe; do
            container="$(docker ps --filter label=com.docker.compose.project=yunlan --filter "label=com.docker.compose.service=$service" --format '{{.ID}}')"
            revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$container")"
            test "$revision" = "$GITHUB_SHA"
          done
          python3 "$YUNLAN_INSTALL_DIR/scripts/check-panel-compose.py" --root "$YUNLAN_INSTALL_DIR"
          python3 "$YUNLAN_INSTALL_DIR/scripts/smoke-deployment.py" --probe-url http://127.0.0.1:18081
      - name: Show installation diagnostics on failure
        if: failure()
        run: python3 scripts/deploy-diagnostics.py --root "$YUNLAN_INSTALL_DIR" --stage published-install --exit-code 1 -- --project-name yunlan --project-directory "$YUNLAN_INSTALL_DIR" -f "$YUNLAN_INSTALL_DIR/.yunlan.runtime.yaml"
      - name: Stop installed services
        if: always()
        run: |
          if [[ -f "$YUNLAN_INSTALL_DIR/.env" ]]; then
            docker compose --project-directory "$YUNLAN_INSTALL_DIR" --env-file "$YUNLAN_INSTALL_DIR/.env" -f "$YUNLAN_INSTALL_DIR/.yunlan.runtime.yaml" down --remove-orphans
          fi
