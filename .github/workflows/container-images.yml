name: Build yunlan images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yunlan-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-check:
    name: Check install and service syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell entry points
        run: bash -n install.sh deploy.sh
      - name: Check finance JavaScript
        run: node --check finance/web/app.js
      - name: Check finance Python syntax
        run: python3 -m compileall -q finance
      - name: Check installer Python syntax
        run: python3 -m py_compile scripts/configure-install.py
      - name: Validate complete Compose schema
        env:
          APP_MODE: demo
          ADMIN_TOKEN: yunlan-ci-admin-placeholder-not-production
          FINANCE_PROXY_SECRET: yunlan-ci-finance-placeholder-not-production
          PROBE_SHARED_SECRET: yunlan-ci-probe-placeholder-not-production
        run: docker compose --profile probe config --quiet

  images:
    name: Build ${{ matrix.component }}
    needs: source-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: yunlan
            dockerfile: Dockerfile
            suffix: ""
          - component: yunlan-finance
            dockerfile: finance/Dockerfile
            suffix: "-finance"
          - component: yunlan-probe
            dockerfile: login-probe/Dockerfile
            suffix: "-probe"
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: printf 'name=ghcr.io/%s%s\n' "${REPOSITORY,,}" '${{ matrix.suffix }}' >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
